# Local development infrastructure: `make up`.
# The API itself runs on the host with `make run`; start it in a container with `--profile app`.
name: orbit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "${ORBIT_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible file storage. MinIO no longer publishes community images (ADR-0003).
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # master UI
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot bucket creation, run by `make up` after the services are healthy.
  seaweedfs-init:
    profiles: [init]
    image: chrislusf/seaweedfs:latest
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 | grep -qw orbit ||
          echo 's3.bucket.create -name orbit' | weed shell -master=seaweedfs:9333
    restart: "no"

  livekit:
    image: livekit/livekit-server:latest
    # --dev: fixed API key devkey/secret, single UDP port 7882 for media.
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  orbit:
    profiles: [app]
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      ORBIT_DATABASE_URL: postgres://orbit:orbit@postgres:5432/orbit?sslmode=disable
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  seaweedfs-data:
