openapi: 3.0.3
info:
  title: Orbit API
  version: 0.1.0
  description: |
    API of orbit-server. This file is the contract: the Go server is generated from it
    (oapi-codegen strict server) and orbit-web generates its client from it.
    Every request is validated against this schema before it reaches a handler.
tags:
  - name: system
    description: Probes for orchestrators and load balancers.
  - name: auth
    description: |
      Accounts and sessions. A session lives in the `orbit_session` cookie: it is set on
      register and login and cleared on logout. The cookie is HttpOnly, so a script cannot
      read it, and the browser sends it on a WebSocket upgrade as well, which a header
      cannot do. Endpoints marked below as needing a session answer 401 without a live one.
  - name: workspaces
    description: |
      Servers (a workspace) and their members. Every operation checks the caller's role
      on the server itself: a hidden button is not protection. A caller who is not a member
      gets 404, not 403, so the API does not reveal which servers exist.
      A server decides what its members may do (`memberPermissions`): invite people,
      create channels, attach files. The owner and admins may always do all of it.
  - name: channels
    description: |
      Text channels inside a server. Reading follows membership; writing is open to
      every member unless the channel is read-only, where only admins and the owner write.
      Channels are renamed, reordered and deleted by admins and the owner. They create
      channels too, and so do members when the server allows it (`canCreateChannels`).
  - name: messages
    description: |
      Messages in a channel. Sending carries the client's own id, so a resend after a
      network failure returns the message already stored instead of a second copy.
      History comes in pages ordered by `seq`, a number that only grows inside a channel.
  - name: invites
    description: |
      Invite links and the guest entrance. From the link to the room in three steps:
      open the link, give a name, join — a guest needs no account, and keeps its history
      when it signs up later.
  - name: unread
    description: |
      How far each person has read. The cursor is a `seq` per channel; it only moves
      forward, and it is the same on every device that account is signed in on.
  - name: files
    description: |
      Files and images in a channel (FR-05). The upload goes through the server, which
      checks the size and reads the first bytes to see what the file really is — the
      name proves nothing. Downloads go straight from the object store by a short-lived
      signed link, issued only to someone who may read the channel.
  - name: conversations
    description: |
      Direct messages and small group chats. A conversation is a channel without a
      server, so messages, files and read cursors work for it through the same
      endpoints; only who may read it is decided differently — by being in it.
  - name: devices
    description: |
      The devices of an account and their public keys. A secret chat is a pair of
      devices: keys are generated on the device, registered here, and the private
      halves never reach the server. One-time keys are handed out one per request,
      so two senders cannot start a session with the same pre-key.
  - name: secret-chats
    description: |
      Chats the server cannot read. Only ciphertext envelopes travel through it;
      the decrypted history lives on the device and is never uploaded. The server
      sees who talks to whom, when and how large — that is the whole metadata it
      has, and the UI says so. A chat is bound to one device: another device of the
      same person simply has no history.
  - name: voice
    description: |
      LiveKit access for voice channels. The token is issued by session; its grants
      follow the caller's role, so a listener may join without publishing.
  - name: privacy
    description: |
      Who may start a direct conversation with an account, who may send it a
      friendship request, and whom it blocks. A refusal is the same answer as an
      account that does not exist, so the API never reveals whether someone is
      here. A block works both ways for starting and writing in a dialogue; in a
      group chat the messages of a blocked author stay in history, marked for the
      person who blocked them. A block also withdraws a pending friendship
      request and ends the friendship, without telling either side why.
  - name: profile
    description: |
      What people see about each other: a display name, a bio, an accent colour
      and a custom status with an optional deadline. The unique `@nickname` stays
      the handle — mentions and search keep using it, and the display name is only
      what the UI draws. A profile is visible to people on a common server, in a
      common conversation, or to friends once friendships exist; anyone else gets
      the same 404 as an unknown account. Changes arrive as `user.updated`.
  - name: friends
    description: |
      Friendships are pairs of accounts with at most one row between them: a
      pending request or an accepted friendship. A request is sent by exact
      nickname, compared without case. The only answer to sending one is 202
      with the same body whether the account exists, whether the recipient
      allows requests and whether a block stands — otherwise the endpoint would
      become a way to check who is here. Lists are always the caller's own.
  - name: push
    description: |
      Web Push: a browser that agreed to notifications registers its push
      subscription here, and the server sends to it when the account has no
      Orbit tab open — a direct or group message, or a mention. A notification
      says who wrote and where, never what: the text stays in the app, and a
      secret chat never produces one. Push is off on an instance without VAPID
      keys; `GET /push/config` tells the client.
  - name: notification-settings
    description: |
      How loudly each server, channel and conversation speaks, per account and
      not per device. A channel inherits its server's level unless it has one of
      its own; a server channel falls back to mentions, a conversation to every
      message. A mute deadline silences the target until it passes, whatever the
      level says. The same rows decide in-tab notifications and push, and a change
      reaches the account's other devices as `notification_settings.updated`.
  - name: search
    description: |
      Full-text search over message text. PostgreSQL's Russian and English
      dictionaries stem the query, so a word finds its other forms. The search
      never sees more than the caller already may read: channels hidden from
      them, other servers and conversations without them are not in the index
      it is allowed to use, and secret chats are never searched at all. A
      blocked author does not surface either. Results come newest first with a
      short highlighted fragment and the channel to jump back to.
  - name: feedback
    description: |
      Bug reports sent from inside the app. The report carries what the person
      wrote, an optional screenshot and the technical context the client attaches
      by itself: the build, the browser and system, and the route without its
      query. The account comes from the session, never from the body. No message
      text, token or secret chat content belongs in a report.
paths:
  /healthz:
    get:
      operationId: getLiveness
      tags: [system]
      summary: Liveness probe — the process is running.
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Liveness" }
  /readyz:
    get:
      operationId: getReadiness
      tags: [system]
      summary: Readiness probe — the instance can serve traffic.
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: A dependency is down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account and start a session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created; the session cookie is set.
          headers:
            Set-Cookie:
              description: The session cookie, HttpOnly.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: The nickname or email is taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start a session for an existing account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Session started; the cookie is set.
          headers:
            Set-Cookie:
              description: The session cookie, HttpOnly.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401":
          description: Wrong login or password. The response does not say which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End this session. Needs a session.
      description: Revokes only the session that made the request; other devices stay signed in.
      responses:
        "204":
          description: Session ended; the cookie is cleared.
          headers:
            Set-Cookie:
              description: The cleared session cookie.
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The account of this session. Needs a session.
      responses:
        "200":
          description: The current account, with its public profile and its email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfProfile" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the password. Needs a session.
      description: |
        Every session of the account is revoked, this one included: a stolen session
        dies with the password change, and the client signs in again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "204":
          description: Password changed; every session is revoked and the cookie is cleared.
          headers:
            Set-Cookie:
              description: The cleared session cookie.
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: The servers this account belongs to, with its role in each. Needs a session.
      responses:
        "200":
          description: The servers of this account.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceMembership" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a server. Needs a session.
      description: The caller becomes its owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceCreateRequest" }
      responses:
        "201":
          description: Server created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMembership" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspace
      tags: [workspaces]
      summary: One server and the caller's role in it. Needs membership.
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMembership" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      summary: Change the name, the description or the member permissions of a server. Admin or owner.
      description: |
        Only the fields sent change. An empty `description` clears it. Every member
        watching the server gets a `workspace.updated` event. New permissions apply to
        the next action of everyone, already connected clients included.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceUpdateRequest" }
      responses:
        "200":
          description: The server as it is now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMembership" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWorkspace
      tags: [workspaces]
      summary: Delete a server with everything in it. Owner only.
      responses:
        "204":
          description: Server deleted.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces/{workspaceId}/icon:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    put:
      operationId: uploadWorkspaceIcon
      tags: [workspaces]
      summary: Set the icon of a server. Admin or owner.
      description: |
        A PNG, JPEG or WebP image; the type is read from the bytes, not from the name.
        The new icon replaces the old one, which is deleted. Members see it through
        `iconUrl`, a short-lived signed link. Every member watching the server gets a
        `workspace.updated` event.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The server with its new icon.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMembership" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413":
          description: The image is larger than this instance allows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Not a PNG, JPEG or WebP image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWorkspaceIcon
      tags: [workspaces]
      summary: Remove the icon of a server. Admin or owner.
      description: Removing an icon that is not there is not an error.
      responses:
        "200":
          description: The server without an icon.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMembership" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listWorkspaceMembers
      tags: [workspaces]
      summary: Members of a server and their roles. Needs membership.
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceMember" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: setWorkspaceMemberRole
      tags: [workspaces]
      summary: Change a member's role. Owner only.
      description: |
        Only the owner moves people between roles, and a server always keeps an owner:
        the owner can hand the role over, which makes them an admin, but cannot leave the
        server without one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceMemberRoleRequest" }
      responses:
        "200":
          description: The member with their new role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMember" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeWorkspaceMember
      tags: [workspaces]
      summary: Remove a member. Admin or owner; anyone may remove themselves.
      description: |
        An admin cannot remove another admin or the owner. Removal takes effect at once:
        the next request or event subscription of that member is refused.
      responses:
        "204":
          description: Member removed.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces/{workspaceId}/bans:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listWorkspaceBans
      tags: [workspaces]
      summary: Who is banned from this server. Admin or owner.
      responses:
        "200":
          description: The bans.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceBan" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces/{workspaceId}/bans/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/UserId"
    put:
      operationId: banWorkspaceMember
      tags: [workspaces]
      summary: Ban someone from a server. Admin or owner.
      description: |
        Removes the member and keeps them out: an invite link does not let them back.
        An admin cannot ban another admin or the owner.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceBanRequest" }
      responses:
        "200":
          description: The ban.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceBan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unbanWorkspaceMember
      tags: [workspaces]
      summary: Lift a ban. Admin or owner.
      responses:
        "204":
          description: Ban lifted.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces/{workspaceId}/channels:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listChannels
      tags: [channels]
      summary: Channels of a server, in their order. Needs membership.
      responses:
        "200":
          description: The channels.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      operationId: createChannel
      tags: [channels]
      summary: Create a channel. Admin or owner, or a member when the server allows it.
      description: |
        The channel goes to the end of the list. A member allowed by
        `memberPermissions.canCreateChannels` may create only a channel everyone writes
        in: a read-only one is for admins to make.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelCreateRequest" }
      responses:
        "201":
          description: Channel created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: A channel of this server already has that name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces/{workspaceId}/channels/order:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    put:
      operationId: reorderChannels
      tags: [channels]
      summary: Set the order of the channels. Admin or owner.
      description: |
        The body lists every channel of the server once, in the order people will see.
        A list that misses a channel or names a foreign one is refused, so the order
        never ends up half applied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelOrderRequest" }
      responses:
        "200":
          description: The channels in their new order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces/{workspaceId}/roles:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listRoles
      tags: [roles]
      summary: The roles of a server, highest first. Any member.
      responses:
        "200":
          description: Every role, @everyone last.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a role just above @everyone. manageRoles.
      description: |
        The new role grants only permissions the caller has. It starts at the
        bottom of the order, above @everyone; move it with the order endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleCreateRequest" }
      responses:
        "201":
          description: The role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces/{workspaceId}/roles/order:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    put:
      operationId: reorderRoles
      tags: [roles]
      summary: Set the order of every role but @everyone. manageRoles.
      description: |
        A role the caller may not manage — at or above their highest — must keep
        its place, and no managed role may end up above the caller's highest.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleOrderRequest" }
      responses:
        "200":
          description: Every role in the new order, highest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/roles/{roleId}:
    parameters:
      - $ref: "#/components/parameters/RoleId"
    patch:
      operationId: updateRole
      tags: [roles]
      summary: Rename, recolour, hoist or change the permissions of a role. manageRoles.
      description: Only a role below the caller's highest, and only permissions the caller has.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpdateRequest" }
      responses:
        "200":
          description: The role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteRole
      tags: [roles]
      summary: Delete a role below the caller's highest. manageRoles. Not @everyone.
      responses:
        "204":
          description: Deleted; it is taken from everyone who held it.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces/{workspaceId}/members/{userId}/roles/{roleId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/RoleId"
    put:
      operationId: grantRole
      tags: [roles]
      summary: Give a member a role. manageRoles, the role below the caller's highest.
      description: The target must rank below the caller, or be the caller themselves.
      responses:
        "200":
          description: The member with their roles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMember" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeRole
      tags: [roles]
      summary: Take a role from a member. Same rules as giving it.
      responses:
        "200":
          description: The member with their roles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMember" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/channels/{channelId}/overrides:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: listChannelOverrides
      tags: [roles]
      summary: What roles may do differently in this channel. manageChannels there.
      responses:
        "200":
          description: One entry per role with an override.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelOverride" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/channels/{channelId}/overrides/{roleId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - $ref: "#/components/parameters/RoleId"
    put:
      operationId: setChannelOverride
      tags: [roles]
      summary: Set what one role may do differently here. manageChannels there.
      description: |
        Only permissions that may change per channel, and only ones the caller
        has; for a role other than @everyone, only one below the caller's highest.
        Empty allow and deny remove the override.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelOverrideRequest" }
      responses:
        "200":
          description: Every override of the channel after the change.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelOverride" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteChannelOverride
      tags: [roles]
      summary: Remove one role's override here. Same rules as setting it.
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: getChannel
      tags: [channels]
      summary: One channel. Needs membership in its server.
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Rename a channel, change its topic or its write access. Admin or owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelUpdateRequest" }
      responses:
        "200":
          description: The updated channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: A channel of this server already has that name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: Delete a channel with its messages and attachments. Admin or owner.
      responses:
        "204":
          description: Channel deleted.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/channels/{channelId}/voice-token:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: createChannelVoiceToken
      tags: [voice]
      summary: A LiveKit token for this voice channel. Needs membership in its server.
      description: |
        The room is the channel: its LiveKit name is the channel id and the participant
        identity is the account id, so signing in twice on the same account replaces the
        first session instead of adding a second participant. Joining needs membership;
        publishing the microphone and the screen needs the right to speak.
      responses:
        "201":
          description: Token issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceToken" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/channels/{channelId}/messages:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: listMessages
      tags: [messages]
      summary: A page of history, newest first. Needs membership in the server.
      parameters:
        - name: before
          in: query
          required: false
          description: Return messages older than this `seq`. Omit for the newest page.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          required: false
          description: How many messages to return.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message. Needs the right to write in the channel.
      description: |
        `clientMessageId` makes the send idempotent: the same id in the same channel
        from the same account returns the message already stored, with 200 instead of 201.
        A message with `attachmentIds` in a server channel needs the right to attach
        files: a member gets 403 when `memberPermissions.canAttachFiles` is off.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageCreateRequest" }
      responses:
        "200":
          description: This message was already sent; the stored one comes back.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "201":
          description: Message sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    patch:
      operationId: editMessage
      tags: [messages]
      summary: Edit your own message.
      responses:
        "200":
          description: The edited message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageUpdateRequest" }
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Delete your own message.
      description: |
        The message stays in the history as deleted, without its text: replies to it
        and read cursors keep working.
      responses:
        "200":
          description: The deleted message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{messageId}/preview:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    delete:
      operationId: deleteMessagePreview
      tags: [messages]
      summary: Remove the link preview from your own message.
      description: |
        Only the author may. Editing the message later reads the card of its new
        first link again. A message without a preview answers 404.
      responses:
        "204":
          description: The preview is gone.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{messageId}/reactions/{emoji}:
    parameters:
      - $ref: "#/components/parameters/MessageId"
      - name: emoji
        in: path
        required: true
        description: The reaction itself, for example 👍.
        schema: { type: string, minLength: 1, maxLength: 32 }
    put:
      operationId: addReaction
      tags: [messages]
      summary: React to a message. Needs the right to write in the channel.
      responses:
        "200":
          description: The message with its reactions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeReaction
      tags: [messages]
      summary: Take your reaction back.
      responses:
        "200":
          description: The message with its reactions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces/{workspaceId}/invites:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listInvites
      tags: [invites]
      summary: Invite links of a server. Admin or owner.
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvite
      tags: [invites]
      summary: Create an invite link. Admin or owner, or a member when the server allows it.
      description: |
        A member may create a link when `memberPermissions.canInvite` is on. Listing and
        revoking links stay with admins and the owner.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteCreateRequest" }
      responses:
        "201":
          description: The link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/invites/{inviteId}:
    parameters:
      - name: inviteId
        in: path
        required: true
        description: Invite identifier.
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeInvite
      tags: [invites]
      summary: Revoke an invite link. Admin or owner.
      responses:
        "204":
          description: The link no longer works.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/invites/{code}/preview:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    get:
      operationId: previewInvite
      tags: [invites]
      summary: What this link leads to. No session needed.
      description: |
        Shows the server behind a link to whoever holds it, so the page can say what
        they are joining before they give a name. A dead link answers 404.
      responses:
        "200":
          description: The server behind the link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/invites/{code}/accept:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    post:
      operationId: acceptInvite
      tags: [invites]
      summary: Join the server behind the link. Needs a session.
      responses:
        "200":
          description: The server and your role in it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMembership" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: You are banned from this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/invites/{code}/guest:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    post:
      operationId: joinAsGuest
      tags: [invites]
      summary: Enter as a guest, by name alone. No account, no session needed.
      description: |
        Creates a guest account, starts a session and joins the server in one step.
        The guest keeps its id, so signing up later keeps its history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestJoinRequest" }
      responses:
        "201":
          description: The guest is in; the session cookie is set.
          headers:
            Set-Cookie:
              description: The session cookie, HttpOnly.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestJoin" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The nickname is taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/auth/claim:
    post:
      operationId: claimGuestAccount
      tags: [auth]
      summary: Turn this guest into a full account. Needs a guest session.
      description: |
        Keeps the same account, so servers, messages and read cursors stay where they
        are; it only adds a password, and an email when given.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: The account, now a full one; the session continues.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: This session is not a guest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The nickname or email is taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces/{workspaceId}/unread:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listUnread
      tags: [unread]
      summary: Unread counts for every channel of a server. Needs membership.
      description: One request for the whole sidebar, not one per channel.
      responses:
        "200":
          description: The counts, one entry per channel.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelUnread" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/channels/{channelId}/read:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    put:
      operationId: markChannelRead
      tags: [unread]
      summary: Move the read cursor of this channel. Needs membership.
      description: |
        The cursor only moves forward, so a device that was offline cannot make
        messages unread again. Other devices of the same account are told at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadCursorRequest" }
      responses:
        "200":
          description: Where the cursor now stands, with what is left unread.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelUnread" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/channels/{channelId}/attachments:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - name: expiresAt
        in: query
        required: false
        description: |
          When the server should forget the file. Only a secret chat honours it, and
          it is capped at one week; elsewhere the value is ignored.
        schema: { type: string, format: date-time }
    post:
      operationId: uploadAttachment
      tags: [files]
      summary: Upload a file for a message in this channel. Needs the right to write and to attach files.
      description: |
        The file is stored on its own; it belongs to nobody until a message names it in
        `attachmentIds`. A file whose message never arrives is swept away later.
        In a server channel a member needs `memberPermissions.canAttachFiles`; in a
        conversation everyone in it may attach.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: The file is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413":
          description: The file is larger than this instance allows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: This kind of file is not accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/attachments/{attachmentId}:
    parameters:
      - name: attachmentId
        in: path
        required: true
        description: Attachment identifier.
        schema: { type: string, format: uuid }
    get:
      operationId: getAttachmentLink
      tags: [files]
      summary: A short-lived link to download the file. Needs to read its channel.
      responses:
        "200":
          description: The link and when it stops working.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentLink" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: The devices of this account. Needs a session.
      responses:
        "200":
          description: The caller's devices that are not revoked.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      operationId: registerDevice
      tags: [devices]
      summary: Register this device and its public keys. Needs a session.
      description: |
        The signature proves the device holds the ed25519 private key it registers;
        it covers the account id and both public keys. Registering the same keys
        again returns the device already stored, so a reload does not multiply devices.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegistration" }
      responses:
        "201":
          description: A new device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "200":
          description: The device with these keys was already registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: The device limit of this instance is reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/DeviceIdPath"
    delete:
      operationId: revokeDevice
      tags: [devices]
      summary: Forget one of your devices and its pending keys. Needs a session.
      responses:
        "204":
          description: The device is revoked; its pending envelopes go with it.
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/users/me/dm-policy:
    get:
      operationId: getDmPolicy
      tags: [privacy]
      summary: Who may start a direct conversation with you. Needs a session.
      responses:
        "200":
          description: The current policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmPolicySetting" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      operationId: setDmPolicy
      tags: [privacy]
      summary: Choose who may start a direct conversation with you. Needs a session.
      description: |
        `shared` — people who are on a server with you (the default), `nobody` — no one.
        `friends` is accepted for the friendships that come later and behaves as
        `nobody` until then: nobody may guess that the setting means something else.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DmPolicyUpdate" }
      responses:
        "200":
          description: The policy now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmPolicySetting" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/users/me/blocks:
    get:
      operationId: listUserBlocks
      tags: [privacy]
      summary: The accounts you blocked. Needs a session.
      description: |
        Only your own list: there is no way to read somebody else's blocks, and
        blocking is not visible to the blocked account.
      responses:
        "200":
          description: The blocked accounts, most recently blocked first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlockedUser" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/users/me/blocks/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      operationId: blockUser
      tags: [privacy]
      summary: Block an account. Needs a session.
      description: |
        A blocked account cannot start a dialogue with you, and neither of you can
        write in the dialogue you already had: the block works both ways. Messages
        it writes in a shared group stay in the history, marked for you, so the
        conversation keeps its context. Blocking yourself answers 400; an unknown
        account answers 404, like every other refusal here. Blocking twice is fine.
      responses:
        "204":
          description: Blocked.
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unblockUser
      tags: [privacy]
      summary: Unblock an account. Needs a session.
      description: Unblocking an account that is not blocked is fine.
      responses:
        "204":
          description: Unblocked.
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/users/me/onboarding:
    post:
      operationId: completeMyProfileOnboarding
      tags: [profile]
      summary: Mark the one-time profile step as passed. Needs a session.
      description: |
        Both "save" and "skip" call this, so the step is shown once and never
        again — on this device or another, because `GET /auth/me` answers with
        `profileOnboardedAt`. The call has no body and is idempotent: repeating it
        keeps the first timestamp and still answers 204. A guest is refused with
        403: the step belongs to the flow after signing up or after claiming the
        guest account, and claiming turns the account into a regular one before
        the step runs.
      responses:
        "204":
          description: The step is passed (or was already). Repeating the call changes nothing.
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: A guest account cannot pass the profile step before it signs up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/users/me/profile:
    patch:
      operationId: updateMyProfile
      tags: [profile]
      summary: Change your own profile. Needs a session.
      description: |
        Only the fields sent change: omitting one leaves it as it was. An empty
        `displayName` or `bio` clears it, and the display name then falls back to
        the nickname. The nickname itself is not editable here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: The profile as it is now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/users/me/status:
    put:
      operationId: setMyStatus
      tags: [profile]
      summary: Replace your custom status. Needs a session.
      description: |
        At least one of `emoji` and `text` must be non-empty: an empty status is
        removed with DELETE instead. `expiresIn` is measured by the server, so a
        wrong client clock cannot stretch a status; without it the status lasts
        until it is replaced. An expired status is never returned, even before
        anything rewrites the row.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusUpdate" }
      responses:
        "200":
          description: The profile with the new status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: clearMyStatus
      tags: [profile]
      summary: Remove your custom status. Needs a session.
      description: Removing a status that is not set is fine.
      responses:
        "200":
          description: The profile without a custom status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/users/me/avatar:
    put:
      operationId: uploadMyAvatar
      tags: [profile]
      summary: Set your avatar. Needs a session.
      description: |
        A PNG, JPEG or WebP image; the type is read from the bytes, not from the
        name. GIF is not accepted in the MVP: an animated avatar would either lose
        its animation or need frame-by-frame decoding, which is a separate feature
        and a separate decompression surface.
        The server decodes the image, refuses anything larger than 4096x4096 or
        20 megapixels, strips metadata such as EXIF and stores two WebP sizes,
        256x256 and 64x64, under a fresh unguessable key. The previous objects are
        deleted. Other people see the new avatar through `avatarUrl`, a long-lived
        signed link. Every server, conversation peer and friend of the account
        gets a `user.updated` event.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The profile with the new avatar link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400":
          description: The image is empty, unreadable or its dimensions are too large.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413":
          description: The image is larger than this instance allows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Not a PNG, JPEG or WebP image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMyAvatar
      tags: [profile]
      summary: Remove your avatar. Needs a session.
      description: Removing an avatar that is not there is not an error.
      responses:
        "200":
          description: The profile without an avatar link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/users/me/nickname:
    patch:
      operationId: updateMyNickname
      tags: [profile]
      summary: Change your nickname. Needs a session and the current password.
      description: |
        The nickname is the unique handle, compared without case; the same rule as
        at registration. A guest has no password to confirm, so it cannot use this
        endpoint until it signs up. A nickname that someone released stays out of
        circulation for seven days, so a handle cannot be taken over right after
        its owner gives it up. At most two changes are allowed per account per
        hour; a refused attempt answers 429 with `Retry-After`.
        Other people get `user.updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NicknameUpdate" }
      responses:
        "200":
          description: The account with the new nickname.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfProfile" }
        "400": { $ref: "#/components/responses/Error" }
        "401":
          description: The current password is wrong.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: A guest account has no password to confirm.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The nickname is taken or still held after a release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/users/me/email:
    patch:
      operationId: updateMyEmail
      tags: [profile]
      summary: Change your email. Needs a session and the current password.
      description: |
        There is no confirmation email yet, so a hand-written address is stored as
        unverified. An empty string clears the address, which is allowed for an
        account with a password; the account then signs in by nickname alone. A
        guest has no password to confirm and sets an address by signing up instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailUpdate" }
      responses:
        "200":
          description: The account with its new email, or with none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfProfile" }
        "400": { $ref: "#/components/responses/Error" }
        "401":
          description: The current password is wrong.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: A guest account has no password to confirm.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The email is already used by another account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/users/{userId}/profile:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getUserProfile
      tags: [profile]
      summary: Someone's public profile. Needs a shared server or conversation.
      description: |
        A common server, a common conversation or a friendship opens this; a
        stranger and an unknown id both answer 404, so the endpoint does not tell
        which accounts exist. Your own profile is always readable.
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/users/{userId}/mutual:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getMutual
      tags: [profile]
      summary: What you and another account share. Needs a shared server or friendship.
      description: |
        The servers you are both on and the friends you both have: the
        intersection of the two accounts, never a union. The audience is the
        profile audience — a common server, a common conversation or a friendship;
        a stranger, an unknown id and a blocked pair all answer the same 404, so
        the endpoint cannot be used to probe accounts. Asking about yourself
        answers 400: a mutual list needs two different accounts.
        Server icons are signed links; the icon keys never leave the server.
      responses:
        "200":
          description: The shared servers and friends, sorted by name and nickname.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutualOverview" }
        "400":
          description: The caller named their own account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/users/{userId}/devices:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: listUserDevices
      tags: [devices]
      summary: The public keys of another person's devices. Needs a session.
      description: Public keys are public; the private halves are not here to leak.
      responses:
        "200":
          description: The person's devices that are not revoked.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/devices/{deviceId}/one-time-keys:
    parameters:
      - $ref: "#/components/parameters/DeviceIdPath"
    post:
      operationId: uploadOneTimeKeys
      tags: [devices]
      summary: Add one-time keys to your device. Needs a session.
      description: |
        A key is used once, when someone starts a session with this device. The
        client uploads a new batch when the server says the supply is low.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OneTimeKeyUpload" }
      responses:
        "200":
          description: How many keys the device now has.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OneTimeKeyCount" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/devices/{deviceId}/one-time-keys/count:
    parameters:
      - $ref: "#/components/parameters/DeviceIdPath"
    get:
      operationId: countOneTimeKeys
      tags: [devices]
      summary: How many one-time keys your device still has. Needs a session.
      description: |
        The client reads this before a session starts and uploads a new batch when
        the supply is low; a device nobody writes to would otherwise run dry
        silently and refuse every new session.
      responses:
        "200":
          description: The number of keys this device can still hand out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OneTimeKeyCount" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/devices/{deviceId}/key-bundle:
    parameters:
      - $ref: "#/components/parameters/DeviceIdPath"
    get:
      operationId: getKeyBundle
      tags: [devices]
      summary: The keys to start a session with this device. Needs a session.
      description: |
        The one-time key is consumed by this request: two callers never get the
        same one. 404 means the device is gone or its owner must upload more keys.
      responses:
        "200":
          description: The identity keys and one one-time key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyBundle" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/secret-chats:
    get:
      operationId: listSecretChats
      tags: [secret-chats]
      summary: The secret chats of this device. Needs a session.
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
      responses:
        "200":
          description: The chats this device holds keys for.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SecretChat" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      operationId: startSecretChat
      tags: [secret-chats]
      summary: Open a secret chat with one device of one person. Needs a session.
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
      description: |
        A device pair has one secret chat. The peer device must be named when the
        person has more than one; without it, a person with several devices is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretChatStartRequest" }
      responses:
        "201":
          description: A new secret chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretChat" }
        "200":
          description: The chat this pair of devices already had.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretChat" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: The session is a guest, or the device is not the caller's.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The person has several devices and the peer device was not named.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/secret-chats/{secretChatId}:
    parameters:
      - name: secretChatId
        in: path
        required: true
        description: Secret chat identifier; it is the channel id of the chat.
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/DeviceHeader"
    get:
      operationId: getSecretChat
      tags: [secret-chats]
      summary: One secret chat this device takes part in.
      responses:
        "200":
          description: The chat and the peer device keys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretChat" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: leaveSecretChat
      tags: [secret-chats]
      summary: Delete this secret chat for this device and forget it on the server.
      description: |
        The chat is a pair of devices, so deleting it deletes it for both: the
        server drops the binding, the undelivered envelopes and the channel. The
        local history of the caller is wiped by the client; the peer's own copy
        disappears from its list and stops opening.
      responses:
        "204":
          description: The secret chat is gone from the server.
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/secret-chats/{secretChatId}/envelopes:
    parameters:
      - name: secretChatId
        in: path
        required: true
        description: Secret chat identifier.
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/DeviceHeader"
    get:
      operationId: listSecretEnvelopes
      tags: [secret-chats]
      summary: Ciphertext waiting for this device, oldest first.
      description: What was sent while the device was offline. Acknowledging deletes.
      responses:
        "200":
          description: Undelivered envelopes of this device.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SecretEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      operationId: sendSecretEnvelope
      tags: [secret-chats]
      summary: Hand one ciphertext envelope to the server.
      description: |
        The body is opaque bytes, base64-encoded. The server stores and forwards it,
        and deletes it when the recipient acknowledges or when `expiresAt` passes.
        Nothing in it is read, logged or measured beyond its size.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretEnvelopeCreate" }
      responses:
        "201":
          description: Stored and, if the recipient is connected, already on its way.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/envelopes/{envelopeId}:
    parameters:
      - name: envelopeId
        in: path
        required: true
        description: Envelope identifier.
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/DeviceHeader"
    delete:
      operationId: acknowledgeSecretEnvelope
      tags: [secret-chats]
      summary: Delete a delivered envelope. Only its recipient may.
      responses:
        "204":
          description: The envelope is gone from the server.
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: A page of your conversations, the liveliest first. Needs a session.
      description: |
        Each row already carries what a sidebar draws: the newest message with its
        author, the unread and mention counts after this account's read cursor, and
        the group name. Hidden conversations are left out; a message that arrives
        after they were hidden brings them back. Secret chats never appear here.
        The cursor is opaque: pass `nextCursor` back as `cursor` for the next page.
      parameters:
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page. Omit for the first page.
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          required: false
          description: How many conversations to return.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      operationId: startConversation
      tags: [conversations]
      summary: Open a conversation with one or more people. Needs a session.
      description: |
        With one other person this returns the dialogue you already have, if there is
        one: a pair has a single conversation. A name is set later by a group member.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationStartRequest" }
      responses:
        "200":
          description: The dialogue this pair already had.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "201":
          description: A new conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: |
            No such account, or one that may not be talked to. The same answer for
            both, so the API never reveals which accounts exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/unread:
    get:
      operationId: getConversationUnread
      tags: [conversations]
      summary: The unread badge for all conversations. Needs a session.
      description: |
        The sum of unread messages and mentions over every ordinary conversation of
        the caller, with hidden conversations left out exactly as the list leaves
        them out. Secret chats have no read cursors and are never counted.
      responses:
        "200":
          description: The totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationUnread" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: getConversation
      tags: [conversations]
      summary: One conversation you are in.
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateConversation
      tags: [conversations]
      summary: Rename a group. Needs to be in it.
      description: |
        Only a group has a name. A direct dialogue answers 409: it cannot become a
        group, and a new group is a new conversation. Any member may rename it; the
        change is announced to everyone as `conversation.updated` and a system line
        appears in the feed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationRenameRequest" }
      responses:
        "200":
          description: The renamed conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{conversationId}/members:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: addConversationMembers
      tags: [conversations]
      summary: Add people to a group. Any member may.
      description: |
        The group limit (`maxMembers`) counts everyone already there. A direct
        dialogue answers 409 instead of turning into a group: create a new group.
        The added people are told with `conversation.created`, the rest with
        `conversation.updated`, and each addition leaves a system line.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationMembersRequest" }
      responses:
        "200":
          description: The conversation with its new members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{conversationId}/members/me:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    delete:
      operationId: leaveConversation
      tags: [conversations]
      summary: Leave a group. Needs to be in it.
      description: |
        Access to the history, its files and the live stream ends at once: the
        endpoints behind them check membership on every request. A direct dialogue
        answers 409 — hide it instead. The remaining members get
        `conversation.updated` and a system line.
      responses:
        "204":
          description: Left the group.
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{conversationId}/hidden:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: hideConversation
      tags: [conversations]
      summary: Hide a conversation from your list. Needs to be in it.
      description: |
        Hiding is private: the other members see nothing, and no system line is
        written. It lasts until the conversation gets a new message — that message
        is newer than the moment of hiding and puts the conversation back — or until
        `DELETE` on this path. The caller's other devices are told with
        `conversation.hidden`.
      responses:
        "204": { description: Hidden. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unhideConversation
      tags: [conversations]
      summary: Show a hidden conversation again. Needs to be in it.
      responses:
        "204": { description: Shown again. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/users/me/friend-request-policy:
    get:
      operationId: getFriendRequestPolicy
      tags: [privacy]
      summary: Who may add you as a friend. Needs a session.
      responses:
        "200":
          description: The current setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendRequestPolicySetting" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      operationId: setFriendRequestPolicy
      tags: [privacy]
      summary: Choose who may add you as a friend. Needs a session.
      description: |
        `all` — anyone who is not a guest, `shared` — people on a common server
        (the default), `nobody` — no one. A refusal looks exactly like a request
        to an account that does not exist: the sender always gets 202.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FriendRequestPolicyUpdate" }
      responses:
        "200":
          description: The setting now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendRequestPolicySetting" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/friends:
    get:
      operationId: listFriends
      tags: [friends]
      summary: Your friends, with their online status. Needs a session.
      description: |
        A guest has no friends and gets an empty list, which is the same answer
        as an account that never added anyone.
      responses:
        "200":
          description: The friends, sorted by nickname.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Friend" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/friends/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove an account from your friends. Needs a session.
      description: |
        Removing someone who is not a friend is fine: the client retries without
        having to know the current state, and the answer reveals nothing.
      responses:
        "204":
          description: Removed, or there was nothing to remove.
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/friends/requests:
    post:
      operationId: createFriendRequest
      tags: [friends]
      summary: Send a friendship request by exact nickname. Needs a session.
      description: |
        The nickname is compared without case and must match exactly otherwise.
        Every refusal — no such account, the recipient allows no requests, a
        block, a guest — gets the same 202 and the same body as a request that
        was stored or that completed a mutual one. A repeat of your own pending
        request changes nothing. When the other side already has a pending
        request to you, the pair becomes friends at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FriendRequestCreate" }
      responses:
        "202":
          description: |
            The request was accepted for processing. This is also the answer when
            nothing was stored, so it must not be read as proof that the account
            exists or that the request will be delivered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendRequestAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Error" }
    get:
      operationId: listFriendRequests
      tags: [friends]
      summary: Your incoming or outgoing requests. Needs a session.
      description: |
        Only the caller's own requests: `incoming` are ones the caller may accept
        or decline, `outgoing` are ones the caller sent and may cancel. A guest
        gets an empty list.
      parameters:
        - name: direction
          in: query
          required: true
          description: Which side of the requests to list.
          schema: { $ref: "#/components/schemas/FriendRequestDirection" }
      responses:
        "200":
          description: The requests, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FriendRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/friends/requests/{userId}/accept:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: acceptFriendRequest
      tags: [friends]
      summary: Accept a request addressed to you. Needs a session.
      description: |
        Only the addressee may accept: an outgoing request answers 404, like an
        account that does not exist or a pair that is not friends. A full friend
        list answers 409 and leaves the request pending.
      responses:
        "200":
          description: The new friend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Friend" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/friends/requests/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    delete:
      operationId: deleteFriendRequest
      tags: [friends]
      summary: Decline an incoming request or cancel an outgoing one. Needs a session.
      description: |
        The addressee declines, the author cancels; either way the request is
        gone for both. A pair with no pending request answers 404.
      responses:
        "204":
          description: The request is gone.
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/bug-reports:
    post:
      operationId: createBugReport
      tags: [feedback]
      summary: Report a bug from inside the app. Needs a session.
      description: |
        `description` is what went wrong and is required; `steps` is how to repeat
        it. `appVersion`, `userAgent` and `route` are filled in by the client, not
        typed by the person. `route` is a path only: the server drops anything
        after `?` or `#`, so a query cannot carry a token into the report.
        `screenshot` is optional: a PNG, JPEG or WebP image, the type read from
        the bytes, not from the name, and no larger than this instance allows.
        Reports are limited per account; over the limit the answer is 429 with
        `Retry-After`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [description, appVersion, route]
              properties:
                description:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  description: What went wrong, in the person's own words.
                steps:
                  type: string
                  maxLength: 4000
                  description: How to repeat it; may be empty.
                appVersion:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: The client build, as the client knows it.
                userAgent:
                  type: string
                  maxLength: 512
                  description: The browser and system the client runs in.
                route:
                  type: string
                  minLength: 1
                  maxLength: 512
                  pattern: "^/"
                  description: The path the person was on, without query or fragment.
                screenshot:
                  type: string
                  format: binary
                  description: An optional PNG, JPEG or WebP image.
      responses:
        "201":
          description: The report is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BugReport" }
        "400":
          description: |
            A field is missing, blank or too long. The message names the field:
            `description`, `steps`, `appVersion`, `userAgent`, `route` or `screenshot`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413":
          description: The screenshot is larger than this instance allows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The screenshot is not a PNG, JPEG or WebP image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/push/config:
    get:
      operationId: getPushConfig
      tags: [push]
      summary: Whether this instance sends push notifications, and its VAPID key.
      description: |
        `publicKey` is the VAPID application server key in base64url, as
        `PushManager.subscribe` takes it. Absent when push is off.
      responses:
        "200":
          description: The push configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushConfig" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/push/subscriptions:
    post:
      operationId: createPushSubscription
      tags: [push]
      summary: Register this browser's push subscription for the signed-in account.
      description: |
        The body is `PushSubscription.toJSON()` from the browser. The endpoint must
        be an `https` URL of a known push service (Google, Mozilla, Apple,
        Microsoft): the server sends requests there, so it does not accept an
        arbitrary address. Registering the same endpoint again updates its keys,
        and from another account moves it to that account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscriptionInput" }
      responses:
        "201":
          description: The subscription is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscription" }
        "400":
          description: The endpoint is not an https URL of a known push service, or a key is missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503":
          description: Push is off on this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/push/subscriptions/{subscriptionId}:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deletePushSubscription
      tags: [push]
      summary: Stop push notifications to one browser of the caller.
      description: A subscription of another account answers 404, like one that is gone.
      responses:
        "204":
          description: The subscription is removed.
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/notification-settings:
    get:
      operationId: listNotificationSettings
      tags: [notification-settings]
      summary: Every notification level of the signed-in account.
      description: |
        One flat list: the rows the account made for its servers, channels and
        conversations. An empty list means every default applies — a server
        channel speaks on mentions, a conversation on every message. Rows follow
        the account to every device.
      responses:
        "200":
          description: The settings, ordered by scope and target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/notification-settings/{scope}/{targetId}:
    parameters:
      - name: scope
        in: path
        required: true
        schema: { $ref: "#/components/schemas/NotificationScope" }
      - name: targetId
        in: path
        required: true
        description: The server, channel or conversation the setting is about.
        schema: { type: string, format: uuid }
    put:
      operationId: setNotificationSetting
      tags: [notification-settings]
      summary: Set the level and the mute deadline of one server, channel or conversation.
      description: |
        Replaces the whole row: `level` `inherit` takes the channel's server
        level, and a server channel without either speaks on mentions; a
        conversation falls back to every message. `mutedUntil` null means no mute
        deadline, and a deadline in the past is the same as one that has passed.
        The target must be visible to the caller: another account's server, a
        hidden channel or somebody else's conversation answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingUpdate" }
      responses:
        "200":
          description: The stored row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSetting" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: |
            No such target, or one the caller may not see. The same answer for
            both, so the API never reveals a hidden channel or a stranger's server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The account already keeps the maximum number of settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteNotificationSetting
      tags: [notification-settings]
      summary: Drop one setting, returning that target to the default.
      responses:
        "204":
          description: The setting is gone.
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/search/messages:
    get:
      operationId: searchMessages
      tags: [search]
      summary: Full-text search over the messages this account may read.
      description: |
        PostgreSQL full-text search with the Russian and English dictionaries:
        «сообщения» finds «сообщение». Only channels the caller may see and
        conversations the caller is in are searched; a hidden channel, another
        server's channel, a conversation without the caller and a secret chat
        never appear, not even in a count. Deleted messages and system lines are
        skipped, and so are authors the caller blocked. Each result carries a
        `headline` with the matched fragment: the matched words are surrounded
        by U+0002 and U+0003, so the client can mark them without HTML.
      parameters:
        - name: q
          in: query
          required: true
          description: What to look for; words and quoted phrases, as in a search box.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: workspaceId
          in: query
          required: false
          description: Search only the channels of this server that the caller may read.
          schema: { type: string, format: uuid }
        - name: channelId
          in: query
          required: false
          description: Search one channel. A hidden channel answers 404.
          schema: { type: string, format: uuid }
        - name: conversationId
          in: query
          required: false
          description: Search one conversation. One without the caller answers 404.
          schema: { type: string, format: uuid }
        - name: authorId
          in: query
          required: false
          description: Only messages written by this account.
          schema: { type: string, format: uuid }
        - name: hasFiles
          in: query
          required: false
          description: Only messages that carry an attachment.
          schema: { type: boolean, default: false }
        - name: conversationsOnly
          in: query
          required: false
          description: Search conversations only, not the channels of servers.
          schema: { type: boolean, default: false }
        - name: before
          in: query
          required: false
          description: The `nextCursor` of the previous page; omit for the newest page.
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 25, default: 25 }
      responses:
        "200":
          description: One page of results, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageSearchPage" }
        "400":
          description: The query is empty or too long, or two different targets were named.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: The named channel or conversation is not the caller's to read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Error" }
components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Server identifier.
      schema: { type: string, format: uuid }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChannelId:
      name: channelId
      in: path
      required: true
      description: Channel identifier.
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: Conversation identifier; it is also the channel id for messages.
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      description: Account identifier.
      schema: { type: string, format: uuid }
    DeviceIdPath:
      name: deviceId
      in: path
      required: true
      description: Device identifier.
      schema: { type: string, format: uuid }
    DeviceHeader:
      name: X-Orbit-Device
      in: header
      required: true
      description: |
        The device that holds the keys of this chat. A secret chat is bound to one
        device; another device of the same person has its own chats and no history.
      schema: { type: string, format: uuid }
    InviteCode:
      name: code
      in: path
      required: true
      description: The code from the invite link.
      schema: { type: string, minLength: 8, maxLength: 64 }
    MessageId:
      name: messageId
      in: path
      required: true
      description: Message identifier.
      schema: { type: string, format: uuid }
  securitySchemes:
    # Documented here; enforced by the server's own middleware, not by schema validation.
    sessionCookie:
      type: apiKey
      in: cookie
      name: orbit_session
  responses:
    Error:
      description: Error in the common API format.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Too many requests in a short time.
      headers:
        Retry-After:
          description: Seconds to wait before the next attempt.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Machine-readable code: invalid_request, unauthorized, forbidden, not_found,
            conflict, method_not_allowed, body_too_large, too_many_requests, internal.
          example: invalid_request
        message:
          type: string
          description: Human-readable explanation, safe to show to the user.
    PushConfig:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        publicKey:
          type: string
          description: VAPID public key, base64url without padding.
    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          minLength: 1
          maxLength: 2048
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 1, maxLength: 256 }
            auth: { type: string, minLength: 1, maxLength: 256 }
    PushSubscription:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: Keep it to unsubscribe this browser later.
    NotificationScope:
      type: string
      enum: [workspace, channel, conversation]
      description: |
        What the row is about: a server, one of its channels, or a direct or
        group conversation. The target id names the object itself.
    NotificationSetting:
      type: object
      additionalProperties: false
      required: [scope, targetId, level, mutedUntil, updatedAt]
      properties:
        scope: { $ref: "#/components/schemas/NotificationScope" }
        targetId: { type: string, format: uuid }
        level:
          type: string
          enum: [all, mentions, none, inherit]
          description: |
            `all` speaks on every message, `mentions` only when the account is
            named, `none` never. `inherit` takes the server's level for a
            channel and the default for a conversation.
        mutedUntil:
          type: string
          format: date-time
          nullable: true
          description: |
            The target stays silent until this moment, whatever `level` says.
            Null is no deadline; a past moment has already passed.
        updatedAt: { type: string, format: date-time }
    NotificationSettings:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: The account's rows, ordered by scope and target.
          items: { $ref: "#/components/schemas/NotificationSetting" }
    NotificationSettingUpdate:
      type: object
      additionalProperties: false
      description: |
        The whole row is replaced, so both fields are sent. `inherit` returns
        the target to its inherited level; null `mutedUntil` removes the deadline.
      required: [level, mutedUntil]
      properties:
        level:
          type: string
          enum: [all, mentions, none, inherit]
        mutedUntil:
          type: string
          format: date-time
          nullable: true
    MessageSearchHit:
      type: object
      additionalProperties: false
      required: [message, headline, channelName, workspaceId]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        headline:
          type: string
          description: |
            The matched fragment, a few words around the match. Matched words
            are wrapped in U+0002 and U+0003 so the client can mark them without
            trusting HTML in message text.
        channelName:
          type: string
          nullable: true
          description: |
            The channel's name, or a group conversation's title; null for a pair
            dialogue, which names its peer instead.
        workspaceId:
          type: string
          format: uuid
          nullable: true
          description: The server of the channel; null for a conversation.
    MessageSearchPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: The newest matches first.
          items: { $ref: "#/components/schemas/MessageSearchHit" }
        nextCursor:
          type: integer
          format: int64
          nullable: true
          description: |
            Pass as `before` for the next page; null on the last page. This is
            the `seq` of the oldest result here, the same order history uses.
    BugReport:
      type: object
      additionalProperties: false
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Quote it when you talk to the team about this report.
        createdAt:
          type: string
          format: date-time
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [up, down]
    User:
      type: object
      additionalProperties: false
      description: |
        A private account shape for the auth responses: it carries the email and is
        only returned to its owner or at sign-up. Wherever people see each other,
        `UserProfile` is the shape.
      required: [id, nickname, isGuest, createdAt]
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
          minLength: 1
          maxLength: 32
          example: Anna
        email:
          type: string
          format: email
          description: Absent for an account registered by nickname alone, and for a guest.
        isGuest:
          type: boolean
          description: A guest has no password and keeps its id when it signs up.
        createdAt:
          type: string
          format: date-time
    Permission:
      type: string
      enum:
        - administrator
        - manageServer
        - manageRoles
        - manageChannels
        - createChannels
        - kickMembers
        - banMembers
        - manageMessages
        - createInvite
        - attachFiles
        - viewChannel
        - sendMessages
        - speak
      description: |
        One permission a role may grant. administrator grants all of them; the
        last seven may also be changed per channel by an override.
    Role:
      type: object
      additionalProperties: false
      required: [id, name, hoist, position, permissions, isDefault]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 32 }
        color:
          $ref: "#/components/schemas/AccentColor"
        hoist:
          type: boolean
          description: Members holding it are shown as their own group.
        position:
          type: integer
          description: Higher is more senior; @everyone is 0.
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        isDefault:
          type: boolean
          description: "@everyone: every member holds it without being granted it."
    RoleCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 32 }
        color: { $ref: "#/components/schemas/AccentColor" }
        hoist: { type: boolean }
        permissions:
          type: array
          maxItems: 13
          items: { $ref: "#/components/schemas/Permission" }
    RoleUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Only what is sent changes. clearColor removes the colour. The name,
        colour and hoist of @everyone cannot change.
      properties:
        name: { type: string, minLength: 1, maxLength: 32 }
        color: { $ref: "#/components/schemas/AccentColor" }
        clearColor: { type: boolean }
        hoist: { type: boolean }
        permissions:
          type: array
          maxItems: 13
          items: { $ref: "#/components/schemas/Permission" }
    RoleOrderRequest:
      type: object
      additionalProperties: false
      required: [roleIds]
      properties:
        roleIds:
          type: array
          maxItems: 250
          items: { type: string, format: uuid }
          description: Every role but @everyone, highest first.
    ChannelOverride:
      type: object
      additionalProperties: false
      required: [roleId, allow, deny]
      properties:
        roleId: { type: string, format: uuid }
        allow:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        deny:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
    ChannelOverrideRequest:
      type: object
      additionalProperties: false
      required: [allow, deny]
      description: Only permissions that may change per channel; a permission in both is refused.
      properties:
        allow:
          type: array
          maxItems: 7
          items: { $ref: "#/components/schemas/Permission" }
        deny:
          type: array
          maxItems: 7
          items: { $ref: "#/components/schemas/Permission" }
    AccentColor:
      type: string
      enum: [slate, red, amber, green, teal, sky, indigo, violet, pink]
      description: |
        One of the product's named accent tokens, never a raw hex colour: the client
        maps the token to its own palette, so a profile looks right in every theme.
        `slate` is the default.
    CustomStatus:
      type: object
      additionalProperties: false
      description: A short line next to the name, with an optional deadline.
      properties:
        emoji:
          type: string
          maxLength: 32
          description: Shown before the text; a custom status may have only this.
        text:
          type: string
          maxLength: 128
          description: Shown after the emoji; a custom status may have only this.
        expiresAt:
          type: string
          format: date-time
          description: |
            When the status stops showing. Absent means it stays until replaced.
            The server hides an expired status from every response and event.
    SelfProfile:
      allOf:
        - $ref: "#/components/schemas/UserProfile"
        - type: object
          additionalProperties: false
          required: [profileOnboardedAt]
          properties:
            email:
              type: string
              format: email
              nullable: true
              description: |
                The address of this account, or null for a guest. Only ever
                returned about yourself: the public `UserProfile` has no email,
                so nobody else can read it.
            profileOnboardedAt:
              type: string
              format: date-time
              nullable: true
              description: |
                When the one-time "fill in your profile" step was passed, by
                saving or by skipping; null until then, and so null on every new
                account. Only ever returned about yourself: the step must not be
                shown twice, on this device or another, and nobody else needs to
                know it. Clients decide whether to show the step from this field
                alone and mark it with `POST /users/me/onboarding`.
    UserProfile:
      type: object
      additionalProperties: false
      required: [id, nickname, displayName, accentColor, bio, isGuest, createdAt]
      properties:
        id: { type: string, format: uuid }
        nickname:
          type: string
          description: |
            The unique handle. Mentions and search keep using it — the display name
            is only what the UI draws.
        displayName:
          type: string
          minLength: 1
          maxLength: 32
          description: What other people see. Equals `nickname` until the account picks another.
        avatarUrl:
          type: string
          description: |
            A long-lived signed link to the avatar. Absent until an avatar is
            uploaded; the key itself never leaves the server and changes on every
            upload.
        accentColor: { $ref: "#/components/schemas/AccentColor" }
        bio:
          type: string
          maxLength: 190
        customStatus: { $ref: "#/components/schemas/CustomStatus" }
        isGuest:
          type: boolean
          description: A guest has no password and keeps its id when it signs up.
        createdAt: { type: string, format: date-time }
    MutualOverview:
      type: object
      additionalProperties: false
      description: |
        What two accounts share: the servers both are on and the friends both
        have. Each list is an intersection — an item only one of the accounts has
        is not there.
      required: [servers, friends]
      properties:
        servers:
          type: array
          description: Shared servers, sorted by name.
          items: { $ref: "#/components/schemas/MutualServer" }
        friends:
          type: array
          description: Shared friends, sorted by nickname.
          items: { $ref: "#/components/schemas/UserProfile" }
    MutualServer:
      type: object
      additionalProperties: false
      description: |
        A server both accounts are on, as the caller sees it. `role` is the
        caller's own role there, not the other account's.
      required: [id, name, iconUrl, role]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          minLength: 1
          maxLength: 64
        iconUrl:
          type: string
          nullable: true
          description: |
            A signed link to the icon; null without an icon. The key never leaves
            the server, so read the list again for a fresh link.
        role: { $ref: "#/components/schemas/WorkspaceRole" }
    ProfileUpdate:
      type: object
      additionalProperties: false
      description: |
        Only the fields sent change. An empty `displayName` or `bio` clears it; the
        display name then falls back to the nickname. The nickname is not editable.
      properties:
        displayName:
          type: string
          maxLength: 32
          description: Empty string clears it and shows the nickname again.
        bio:
          type: string
          maxLength: 190
          description: Empty string clears it.
        accentColor: { $ref: "#/components/schemas/AccentColor" }
    NicknameUpdate:
      type: object
      additionalProperties: false
      required: [nickname, currentPassword]
      properties:
        nickname:
          type: string
          pattern: "^[A-Za-z0-9А-Яа-яЁё][A-Za-z0-9А-Яа-яЁё _.-]{0,31}$"
          description: |
            The new unique handle. Compared without case, so "Anna" and "anna"
            collide. Latin and Cyrillic letters, digits, space, '.', '_' and '-';
            the same rule as at registration.
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
          description: The password of this account, checked through `internal/auth`.
    EmailUpdate:
      type: object
      additionalProperties: false
      required: [email, currentPassword]
      properties:
        email:
          type: string
          maxLength: 254
          description: |
            The new address, or an empty string to clear it. It is stored as
            unverified until a confirmation flow exists. The schema does not use
            `format: email`, because an empty string is a valid request here; the
            server validates a non-empty address.
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
    StatusUpdate:
      type: object
      additionalProperties: false
      description: |
        Replaces the custom status. At least one of `emoji` and `text` must be
        non-empty; use DELETE to clear the status.
      properties:
        emoji:
          type: string
          maxLength: 32
        text:
          type: string
          maxLength: 128
        expiresIn:
          type: string
          enum: [30m, 4h, end_of_day, never]
          description: |
            How long the status lives. `end_of_day` is the end of the current UTC
            day (00:00 UTC next day), computed by the server so a client clock
            cannot stretch it. Absent means `never`: until replaced or removed.
    DmPolicy:
      type: string
      enum: [shared, friends, nobody]
      description: |
        Who may start a direct conversation with an account. `shared` — people on a
        common server (the default), `nobody` — no one. `friends` is reserved for the
        friendships that come later and behaves as `nobody` until then.
    DmPolicySetting:
      type: object
      additionalProperties: false
      required: [dmPolicy]
      properties:
        dmPolicy: { $ref: "#/components/schemas/DmPolicy" }
    DmPolicyUpdate:
      type: object
      additionalProperties: false
      required: [dmPolicy]
      properties:
        dmPolicy: { $ref: "#/components/schemas/DmPolicy" }
    BlockedUser:
      type: object
      additionalProperties: false
      required: [id, nickname, createdAt]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        createdAt:
          type: string
          format: date-time
          description: When the caller blocked this account.
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [nickname, password]
      properties:
        nickname:
          type: string
          pattern: "^[A-Za-z0-9А-Яа-яЁё][A-Za-z0-9А-Яа-яЁё _.-]{0,31}$"
          description: |
            Shown to other people. Compared without case, so "Anna" and "anna" collide.
            Latin and Cyrillic letters, digits, space, '.', '_' and '-'; the same rule as
            for a guest name, so signing up never rejects the name someone came in with.
          example: Anna
        email:
          type: string
          format: email
          description: Optional; lets the account sign in by email as well.
        password:
          type: string
          minLength: 10
          maxLength: 256
          description: Stored only as an argon2id hash.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Nickname or email, either case.
          example: Anna
        password:
          type: string
          minLength: 1
          maxLength: 256
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
        newPassword:
          type: string
          minLength: 10
          maxLength: 256
    WorkspaceRole:
      type: string
      enum: [owner, admin, member]
      description: |
        owner — one per server: everything, including deleting it and handing the role over.
        admin — renames the server, manages channels, removes and bans members.
        member — reads and writes where the channel allows it.
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, description, iconUrl, memberPermissions, ownerId, createdAt]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: Команда Orbit
        description:
          type: string
          nullable: true
          maxLength: 500
          description: What the server is about; null when nobody wrote it.
        iconUrl:
          type: string
          nullable: true
          description: |
            A signed link to the icon, valid for a short while; null without an icon.
            Read the server again for a fresh one, do not store it.
        memberPermissions: { $ref: "#/components/schemas/WorkspacePermissions" }
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    WorkspacePermissions:
      type: object
      additionalProperties: false
      required: [canInvite, canCreateChannels, canAttachFiles]
      description: |
        What the member role may do on this server. The owner and admins may always do
        all of it. A new server starts with canInvite false, canCreateChannels false and
        canAttachFiles true.
      properties:
        canInvite:
          type: boolean
          description: Members may create invite links.
        canCreateChannels:
          type: boolean
          description: Members may create channels (not read-only ones).
        canAttachFiles:
          type: boolean
          description: Members may upload files and send messages with them.
    WorkspacePermissionsUpdate:
      type: object
      additionalProperties: false
      description: Only the flags sent change; the rest keep their value.
      properties:
        canInvite: { type: boolean }
        canCreateChannels: { type: boolean }
        canAttachFiles: { type: boolean }
    WorkspaceMembership:
      type: object
      additionalProperties: false
      required: [workspace, role]
      description: A server together with the caller's role in it.
      properties:
        workspace: { $ref: "#/components/schemas/Workspace" }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
          description: |
            What the caller may do on this server before any channel: @everyone
            plus their roles; everything for the owner and administrators.
        voice:
          type: array
          items: { $ref: "#/components/schemas/VoicePresence" }
          description: |
            Who is in each voice channel right now. Present on GET of one server;
            omitted where presence is not read (the list of servers).
    WorkspaceMember:
      type: object
      additionalProperties: false
      required: [user, role, joinedAt]
      properties:
        user: { $ref: "#/components/schemas/UserProfile" }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        joinedAt: { type: string, format: date-time }
        roleIds:
          type: array
          items: { type: string, format: uuid }
          description: The roles granted to the member; @everyone is implied and not listed.
        presence:
          $ref: "#/components/schemas/PresenceStatus"
    WorkspaceBan:
      type: object
      additionalProperties: false
      required: [user, createdAt]
      properties:
        user: { $ref: "#/components/schemas/UserProfile" }
        reason:
          type: string
          maxLength: 500
        bannedBy:
          type: string
          format: uuid
          description: Absent when the account that banned has been deleted.
        createdAt: { type: string, format: date-time }
    WorkspaceCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      description: The icon is uploaded separately, right after the server exists.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: Команда Orbit
        description:
          type: string
          maxLength: 500
          description: Optional; empty means none.
        memberPermissions:
          $ref: "#/components/schemas/WorkspacePermissionsUpdate"
    WorkspaceUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields sent change.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 500
          description: The new description; an empty string clears it.
        memberPermissions:
          $ref: "#/components/schemas/WorkspacePermissionsUpdate"
    WorkspaceMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/WorkspaceRole" }
    WorkspaceBanRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
          description: Shown to admins in the ban list, not to the banned person.
    ChannelKind:
      type: string
      enum: [text, voice]
      description: |
        text — messages live here; voice — a persistent LiveKit room with no history.
    Channel:
      type: object
      additionalProperties: false
      required: [id, workspaceId, kind, name, position, isReadOnly, canWrite, createdAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ChannelKind" }
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: общий
        topic:
          type: string
          maxLength: 500
          description: What the channel is for; absent when nobody set one.
        position:
          type: integer
          description: Place in the server's list, from 0.
        isReadOnly:
          type: boolean
          description: |
            @everyone may not write or speak here: an override of @everyone that
            denies sendMessages and speak. Kept for clients that do not edit
            overrides yet.
        canWrite:
          type: boolean
          description: Whether the caller may write in this channel right now.
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
          description: What the caller may do in this channel, overrides applied.
        createdAt: { type: string, format: date-time }
    ChannelCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        kind:
          type: string
          enum: [text, voice]
          default: text
          description: Omit for a text channel.
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: общий
        topic:
          type: string
          maxLength: 500
        isReadOnly:
          type: boolean
          default: false
    ChannelUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: "Only the fields present are changed; an empty topic clears it."
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        topic:
          type: string
          maxLength: 500
          description: An empty string removes the topic.
        isReadOnly:
          type: boolean
    ChannelOrderRequest:
      type: object
      additionalProperties: false
      required: [channelIds]
      properties:
        channelIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
          description: Every channel of the server, once, in the order people will see.
    Message:
      type: object
      additionalProperties: false
      required: [id, channelId, seq, kind, content, mentions, reactions, createdAt]
      properties:
        id: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        seq:
          type: integer
          format: int64
          description: Order inside the channel; also the cursor for the next page.
        kind:
          $ref: "#/components/schemas/MessageKind"
        author:
          allOf:
            - $ref: "#/components/schemas/UserProfile"
          description: Absent when the account has been deleted; the message stays.
        content:
          type: string
          maxLength: 4000
          description: |
            What the author wrote. A system line carries a readable fallback built
            by the server; `system` says what happened, so a client can render it
            in its own language instead.
        system:
          $ref: "#/components/schemas/SystemMessage"
        replyToId:
          type: string
          format: uuid
          description: The message this one answers, if any.
        mentions:
          type: array
          items: { type: string, format: uuid }
          description: Accounts mentioned here, already parsed out of the text.
        reactions:
          type: array
          items: { $ref: "#/components/schemas/Reaction" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time }
        deletedAt:
          type: string
          format: date-time
          description: Set for a deleted message; its content is then empty.
        blocked:
          type: boolean
          description: |
            Set when the author is blocked by the caller: the message stays in the
            history of a shared group, but the client collapses or hides it. Absent
            means the message is shown as usual. Never set in a direct dialogue,
            which does not exist with a blocked account.
        preview:
          $ref: "#/components/schemas/LinkPreview"
    LinkPreview:
      type: object
      additionalProperties: false
      required: [id, url, title]
      properties:
        id: { type: string, format: uuid }
        url:
          type: string
          description: The normalized address the card was read from.
        title:
          type: string
          description: OpenGraph title, or the page's <title> when it has none.
        description: { type: string }
        siteName: { type: string }
        imageUrl:
          type: string
          description: |
            This server's proxy path for the image, never the page's own address:
            a reader's browser must not call a third-party host for a card. Absent
            when the page has no image.
    Reaction:
      type: object
      additionalProperties: false
      required: [emoji, count, reacted]
      properties:
        emoji:
          type: string
          maxLength: 32
        count: { type: integer }
        reacted:
          type: boolean
          description: Whether the caller is among those who reacted.
    MessagePage:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
          description: Newest first.
        nextBefore:
          type: integer
          format: int64
          description: Pass as `before` for the next page; absent at the start of the history.
    MessageCreateRequest:
      type: object
      additionalProperties: false
      required: [clientMessageId, content]
      properties:
        clientMessageId:
          type: string
          minLength: 1
          maxLength: 64
          description: The client's own id for this message; a resend repeats it.
        content:
          type: string
          maxLength: 4000
          description: May be empty when the message carries files.
        replyToId:
          type: string
          format: uuid
        mentions:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
          description: Accounts mentioned in the text; those outside the server are ignored.
        attachmentIds:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
          description: Files uploaded beforehand, by this account, for this channel.
    MessageUpdateRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
    Invite:
      type: object
      additionalProperties: false
      required: [id, code, uses, createdAt]
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          description: Goes at the end of the invite link.
        expiresAt:
          type: string
          format: date-time
          description: Absent for a link without an end.
        maxUses:
          type: integer
          description: Absent for a link without a limit.
        uses: { type: integer }
        createdAt: { type: string, format: date-time }
    InviteCreateRequest:
      type: object
      additionalProperties: false
      properties:
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 8760
          description: How long the link lives. Omit for a link without an end.
        maxUses:
          type: integer
          minimum: 1
          maximum: 1000
          description: How many people may come through it. Omit for no limit.
    InvitePreview:
      type: object
      additionalProperties: false
      required: [workspaceId, workspaceName, memberCount]
      properties:
        workspaceId: { type: string, format: uuid }
        workspaceName: { type: string }
        memberCount: { type: integer }
    GuestJoinRequest:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname:
          type: string
          pattern: "^[A-Za-z0-9А-Яа-яЁё][A-Za-z0-9А-Яа-яЁё _.-]{0,31}$"
          description: Shown to the others in the room.
          example: Аня
    GuestJoin:
      type: object
      additionalProperties: false
      required: [user, membership]
      properties:
        user: { $ref: "#/components/schemas/User" }
        membership: { $ref: "#/components/schemas/WorkspaceMembership" }
    ChannelUnread:
      type: object
      additionalProperties: false
      required: [channelId, lastReadSeq, unread, mentions]
      properties:
        channelId: { type: string, format: uuid }
        lastReadSeq:
          type: integer
          format: int64
          description: The `seq` this account has read up to; 0 when it never opened the channel.
        unread:
          type: integer
          description: Messages after the cursor, not counting this account's own.
        mentions:
          type: integer
          description: How many of those mention this account.
    ReadCursorRequest:
      type: object
      additionalProperties: false
      required: [seq]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 0
          description: The `seq` read up to. A value below the current cursor changes nothing.
    Attachment:
      type: object
      additionalProperties: false
      required: [id, fileName, mimeType, sizeBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string, maxLength: 255 }
        mimeType:
          type: string
          description: What the file turned out to be, read from its first bytes.
        sizeBytes: { type: integer, format: int64 }
        width:
          type: integer
          description: For an image, its width in pixels.
        height:
          type: integer
          description: For an image, its height in pixels.
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: When a secret chat file is deleted from the server. Absent for ordinary files.
    AttachmentLink:
      type: object
      additionalProperties: false
      required: [url, expiresAt, attachment]
      properties:
        url:
          type: string
          description: Signed link straight to the object store.
        expiresAt: { type: string, format: date-time }
        attachment: { $ref: "#/components/schemas/Attachment" }
    Conversation:
      type: object
      additionalProperties: false
      required: [id, kind, members, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: "Also the channel id — messages and files use the channel endpoints."
        kind:
          type: string
          enum: [direct, group]
        name:
          type: string
          maxLength: 100
          description: The group title a member set; absent for a dialogue and for an unnamed group.
        members:
          type: array
          items: { $ref: "#/components/schemas/ConversationMember" }
        createdAt: { type: string, format: date-time }
    ConversationSummary:
      type: object
      additionalProperties: false
      required: [id, kind, members, createdAt, lastReadSeq, unread, mentions]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [direct, group]
        name:
          type: string
          maxLength: 100
          description: The group title; absent for a dialogue and for an unnamed group.
        members:
          type: array
          items: { $ref: "#/components/schemas/ConversationMember" }
        createdAt: { type: string, format: date-time }
        lastMessage:
          $ref: "#/components/schemas/ConversationLastMessage"
        lastReadSeq:
          type: integer
          format: int64
          description: The `seq` this account has read up to in this conversation; 0 when never opened.
        unread:
          type: integer
          description: Messages after the cursor, not counting this account's own.
        mentions:
          type: integer
          description: How many of those mention this account.
    ConversationLastMessage:
      type: object
      additionalProperties: false
      required: [id, seq, kind, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        seq:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/MessageKind"
        author:
          allOf:
            - $ref: "#/components/schemas/UserProfile"
          description: Absent when the account has been deleted.
        content:
          type: string
          maxLength: 120
          description: The first 120 characters; the whole message is in the history.
        system:
          $ref: "#/components/schemas/SystemMessage"
        createdAt: { type: string, format: date-time }
        deletedAt:
          type: string
          format: date-time
          description: Set for a deleted message; its content is then empty.
    ConversationPage:
      type: object
      additionalProperties: false
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: "#/components/schemas/ConversationSummary" }
        nextCursor:
          type: string
          maxLength: 512
          description: Pass as `cursor` for the next page; absent on the last page.
    ConversationUnread:
      type: object
      additionalProperties: false
      required: [unread, mentions]
      properties:
        unread:
          type: integer
          description: The sum over conversations that are not hidden.
        mentions:
          type: integer
          description: How many of those unread messages mention this account.
    MessageKind:
      type: string
      enum: [user, system]
      description: |
        `user` is written by a person. `system` is a line the server writes when
        the group changes ("X added Y", "X left", "X renamed the chat"): it has an
        author and a seq like any message, but no mentions and no text to edit.
    SystemMessage:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [member_added, member_removed, conversation_renamed]
        targetId:
          type: string
          format: uuid
          description: The person added or removed; the author is in `author`.
        name:
          type: string
          maxLength: 100
          description: The new group name, for `conversation_renamed`.
    ConversationRenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The new group title.
    ConversationMembersRequest:
      type: object
      additionalProperties: false
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: uuid }
          description: Whom to add. People already in the group are ignored.
    ConversationMember:
      type: object
      additionalProperties: false
      # The same public fields as UserProfile plus joinedAt. Spelled out rather
      # than allOf: UserProfile forbids additional properties, so an allOf with
      # joinedAt would make the joinedAt itself an unwanted extra field.
      required: [id, nickname, displayName, accentColor, bio, isGuest, createdAt, joinedAt]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        displayName: { type: string, maxLength: 32 }
        avatarUrl: { type: string }
        accentColor: { $ref: "#/components/schemas/AccentColor" }
        bio: { type: string, maxLength: 190 }
        customStatus: { $ref: "#/components/schemas/CustomStatus" }
        isGuest: { type: boolean }
        createdAt: { type: string, format: date-time }
        joinedAt: { type: string, format: date-time }
    ConversationStartRequest:
      type: object
      additionalProperties: false
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: uuid }
          description: Whom to talk to, besides yourself.
    Device:
      type: object
      additionalProperties: false
      required: [id, userId, name, identityKey, signingKey, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name:
          type: string
          maxLength: 64
          description: What the person sees in settings, for example "Chrome on macOS".
        identityKey:
          type: string
          description: Olm curve25519 public key, base64. The server cannot read with it.
        signingKey:
          type: string
          description: Ed25519 public key, base64; signs the registration and the safety number.
        createdAt: { type: string, format: date-time }
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [identityKey, signingKey, signature]
      properties:
        name:
          type: string
          maxLength: 64
          description: Free-form device name; shown only to its owner.
        identityKey: { type: string, minLength: 1, maxLength: 128 }
        signingKey: { type: string, minLength: 1, maxLength: 128 }
        signature:
          type: string
          maxLength: 128
          description: |
            Ed25519 signature, base64, of `orbit-device-v1|<userId>|<identityKey>|<signingKey>`.
            It proves the device holds the private key it is registering.
    OneTimeKey:
      type: object
      additionalProperties: false
      required: [keyId, key]
      properties:
        keyId: { type: string, minLength: 1, maxLength: 64 }
        key: { type: string, minLength: 1, maxLength: 128 }
    OneTimeKeyUpload:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/OneTimeKey" }
    OneTimeKeyCount:
      type: object
      additionalProperties: false
      required: [count]
      properties:
        count: { type: integer, minimum: 0 }
    KeyBundle:
      type: object
      additionalProperties: false
      required: [device, oneTimeKey]
      properties:
        device: { $ref: "#/components/schemas/Device" }
        oneTimeKey: { $ref: "#/components/schemas/OneTimeKey" }
    SecretChatPeer:
      type: object
      additionalProperties: false
      required: [userId, nickname, isGuest, deviceId, identityKey, signingKey]
      properties:
        userId: { type: string, format: uuid }
        nickname: { type: string }
        isGuest: { type: boolean }
        deviceId: { type: string, format: uuid }
        identityKey: { type: string }
        signingKey: { type: string }
    SecretChat:
      type: object
      additionalProperties: false
      required: [id, peer, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: "Also the channel id: encrypted files of this chat are uploaded there."
        peer: { $ref: "#/components/schemas/SecretChatPeer" }
        createdAt: { type: string, format: date-time }
    SecretChatStartRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: { type: string, format: uuid, description: Whom to talk to. }
        peerDeviceId:
          type: string
          format: uuid
          description: Which of their devices. Required when they have more than one.
    SecretEnvelope:
      type: object
      additionalProperties: false
      required: [id, secretChatId, senderDeviceId, recipientDeviceId, type, body, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        secretChatId: { type: string, format: uuid }
        senderDeviceId: { type: string, format: uuid }
        recipientDeviceId: { type: string, format: uuid }
        type:
          type: integer
          enum: [0, 1]
          description: 0 is the first message of an Olm session, 1 a message of a session already established.
        body:
          type: string
          description: Base64 ciphertext. The server never decodes it.
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    SecretEnvelopeCreate:
      type: object
      additionalProperties: false
      required: [recipientDeviceId, type, body, expiresAt]
      properties:
        recipientDeviceId: { type: string, format: uuid }
        type:
          type: integer
          enum: [0, 1]
        body:
          type: string
          minLength: 1
          maxLength: 90000
          description: Base64 ciphertext, at most 64 KiB decoded.
        expiresAt: { type: string, format: date-time }
    PresenceStatus:
      type: string
      enum: [online, idle, dnd, offline]
      description: |
        Where an account is, as other people may know it. `online` — a tab is open and
        in front; `idle` — a tab is open but hidden or untouched for a few minutes;
        `dnd` — the account chose "do not disturb"; `offline` — no tab is open, or the
        account chose to be invisible, which is deliberately indistinguishable.
        The `presence.updated` event carries these same values; the stream itself is
        outside this specification, see the README.

    VoiceParticipant:
      type: object
      additionalProperties: false
      required: [userId, name, muted, deafened, screenSharing]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        muted:
          type: boolean
          description: The microphone is off or not published.
        deafened: { type: boolean }
        screenSharing: { type: boolean }

    VoicePresence:
      type: object
      additionalProperties: false
      required: [channelId, participants]
      properties:
        channelId: { type: string, format: uuid }
        participants:
          type: array
          items: { $ref: "#/components/schemas/VoiceParticipant" }

    VoiceToken:
      type: object
      required: [token, url, identity, expiresAt]
      properties:
        token:
          type: string
          description: LiveKit access token (JWT). Joins exactly one room.
        url:
          type: string
          description: LiveKit URL the client connects to.
          example: ws://localhost:7880
        identity:
          type: string
          description: Participant identity; an account id, so one account is one participant.
          example: 6f1c0a9e-6b1a-4a3a-8f0e-2a4f1d2b3c4d
        expiresAt:
          type: string
          format: date-time
          description: The token cannot be used to join after this moment; an established session continues.
    FriendRequestDirection:
      type: string
      enum: [incoming, outgoing]
      description: |
        Which side of a pending request an account is on. `incoming` — the other
        side sent it, so the caller may accept or decline; `outgoing` — the caller
        sent it, so the caller may cancel.
    FriendRequest:
      type: object
      additionalProperties: false
      required: [userId, nickname, direction, createdAt]
      properties:
        userId:
          type: string
          format: uuid
          description: The other account of the request.
        nickname: { type: string }
        direction: { $ref: "#/components/schemas/FriendRequestDirection" }
        createdAt:
          type: string
          format: date-time
          description: When the request was sent.
    FriendRequestCreate:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            The exact nickname of the other account, compared without case. There
            is no search: a partial or different nickname is simply not a match.
          example: Anna
    FriendRequestAccepted:
      type: object
      additionalProperties: false
      required: [message]
      description: |
        The answer to every friendship request, stored or not. Its invariance is
        the point: it must not let a stranger tell an account that exists and
        allows requests from one that does not.
      properties:
        message:
          type: string
          example: If such a user exists, they will receive your request.
    Friend:
      type: object
      additionalProperties: false
      required: [id, nickname, presence, since]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        presence: { $ref: "#/components/schemas/PresenceStatus" }
        since:
          type: string
          format: date-time
          description: When the friendship was accepted.
    FriendshipPolicy:
      type: string
      enum: [all, shared, nobody]
      description: |
        Who may send a friendship request to an account. `all` — anyone who is
        not a guest, `shared` — people on a common server (the default), `nobody`
        — no one. A block outranks every setting.
    FriendRequestPolicySetting:
      type: object
      additionalProperties: false
      required: [friendRequestPolicy]
      properties:
        friendRequestPolicy: { $ref: "#/components/schemas/FriendshipPolicy" }
    FriendRequestPolicyUpdate:
      type: object
      additionalProperties: false
      required: [friendRequestPolicy]
      properties:
        friendRequestPolicy: { $ref: "#/components/schemas/FriendshipPolicy" }
